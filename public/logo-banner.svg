<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="880" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#11131a"/>
      <stop offset="100%" stop-color="#181b24"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="880" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="240" rx="28" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="879" height="239" rx="27.5" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Ambient Glow -->
  <circle cx="100" cy="80" r="140" fill="url(#glowGrad)"/>

  <!-- Icon Badge (Squircle) -->
  <g transform="translate(56, 76)" filter="url(#shadow)">
    <rect width="88" height="88" rx="26" fill="url(#badgeGrad)"/>
    <!-- Lucide HeartHandshake SVG Path in Dark Charcoal -->
    <g transform="translate(20, 20) scale(2)" stroke="#090a0f" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      <path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08v0c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66"/>
      <path d="m18 15-2-2"/>
      <path d="m15 18-2-2"/>
    </g>
  </g>

  <!-- Typography & Brand Text -->
  <text x="172" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">Hatey Hat</text>
  <text x="382" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#94a3b8">হাতে হাত</text>

  <!-- Tagline -->
  <text x="174" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="-0.01em">হাতে হাত, একসাথে পথ চলা — Community Action Platform</text>

  <!-- Pill Badge: One community, One Bangladesh -->
  <g transform="translate(174, 168)">
    <rect width="260" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="14" cy="14" r="4.5" fill="#10b981"/>
    <text x="28" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.02em">One community, One Bangladesh.</text>
  </g>
</svg>
