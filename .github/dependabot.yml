version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react-framework:
        patterns:
          - "react*"
          - "@types/react*"
    open-pull-requests-limit: 10
    reviewers:
      - "codewarrior303"
    commit-message:
      prefix: "chore(deps)"
