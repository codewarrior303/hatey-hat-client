name: Client CI & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Audit & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://hatey-hat.vercel.app"
          NEXT_PUBLIC_API_URL: "https://hatey-hat-api.vercel.app"
          BETTER_AUTH_SECRET: "ci-build-mock-secret-at-least-32-chars-long"

      - name: Production Dependency Audit
        run: npm audit --omit=dev

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
